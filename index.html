<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pinterest Downloader</title>
    <script>
      try {
        const desc = Object.getOwnPropertyDescriptor(window, 'fetch');
        if (desc && (!desc.set || !desc.writable) && desc.configurable) {
           Object.defineProperty(window, 'fetch', {
             get: desc.get || (() => desc.value),
             set: function(v) {
               Object.defineProperty(window, 'fetch', {
                 value: v,
                 writable: true,
                 configurable: true,
                 enumerable: true
               });
             },
             configurable: true,
             enumerable: true
           });
        }
      } catch(e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
